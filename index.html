<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبتي</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10121a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مكتبتي">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    --bg:#10121a;
    --bg-2:#161a24;
    --panel:#1b1f2b;
    --shelf-dark:#241c14;
    --shelf-mid:#3a2c1c;
    --shelf-edge:#4a3620;
    --gold:#c9a24b;
    --gold-bright:#e3c26f;
    --text:#ede7da;
    --text-dim:#9aa1ad;
    --text-faint:#6b7280;
    --rust:#b5533c;
    --rust-bright:#d1654a;
    --radius:12px;
    --shadow-lg: 0 24px 48px -12px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(ellipse at top, #1a1d2a 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#333846; border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--gold);}

  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input, textarea{font-family:inherit; color:inherit;}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:16px;
    padding:16px 20px;
    background:rgba(16,18,26,.86);
    backdrop-filter: blur(14px);
    border-bottom:1px solid rgba(201,162,75,.14);
  }
  .brand{display:flex; align-items:center; gap:10px; flex-shrink:0;}
  .brand-mark{
    width:34px; height:34px; border-radius:8px;
    background:linear-gradient(155deg, var(--gold-bright), var(--rust));
    display:flex; align-items:center; justify-content:center;
    font-family:'Cairo',sans-serif; font-weight:800; color:#1a1108; font-size:16px;
    box-shadow: 0 4px 14px rgba(201,162,75,.35);
  }
  .brand h1{
    font-family:'Cairo',sans-serif; font-weight:800; font-size:19px; letter-spacing:.2px;
  }
  .brand span{display:block; font-size:11px; color:var(--text-dim); font-weight:400; margin-top:1px;}

  .search-wrap{
    flex:1; max-width:420px; position:relative;
  }
  .search-wrap input{
    width:100%; padding:10px 40px 10px 14px; border-radius:999px;
    background:var(--panel); border:1px solid rgba(255,255,255,.06);
    font-size:14px; outline:none; transition:border-color .2s;
  }
  .search-wrap input:focus{border-color:var(--gold);}
  .search-wrap svg{position:absolute; right:14px; top:50%; transform:translateY(-50%); opacity:.5; pointer-events:none;}

  .add-btn{
    margin-inline-start:auto;
    display:flex; align-items:center; gap:8px;
    background:linear-gradient(155deg, var(--gold-bright), var(--gold));
    color:#1a1108; font-weight:700; font-size:14px;
    padding:10px 18px; border-radius:999px;
    box-shadow: 0 6px 18px rgba(201,162,75,.25);
    transition:transform .15s, box-shadow .15s;
    flex-shrink:0;
  }
  .add-btn:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(201,162,75,.35);}
  .add-btn:active{transform:translateY(0);}

  /* ===== Main ===== */
  main{max-width:1280px; margin:0 auto; padding:28px 24px 80px;}
  .section-title{
    font-family:'Cairo',sans-serif; font-weight:700; font-size:18px;
    margin:0 0 4px 0; display:flex; align-items:center; gap:10px;
  }
  .section-sub{color:var(--text-dim); font-size:13px; margin-bottom:18px;}

  .continue-row{
    display:flex; gap:16px; overflow-x:auto; padding:6px 4px 22px;
    margin-bottom:8px;
  }
  .continue-card{
    flex:0 0 auto; width:150px; cursor:pointer; position:relative;
  }
  .continue-card img{
    width:150px; height:200px; object-fit:cover; border-radius:8px;
    box-shadow:0 10px 20px rgba(0,0,0,.4);
    transition:transform .2s;
  }
  .continue-card:hover img{transform:translateY(-4px);}
  .progress-bar{
    height:3px; background:rgba(255,255,255,.15); border-radius:2px; margin-top:8px; overflow:hidden;
  }
  .progress-bar > div{height:100%; background:var(--gold);}
  .continue-card .ct-title{font-size:12.5px; margin-top:6px; color:var(--text); line-height:1.3;}

  /* ===== Shelf grid ===== */
  .shelf{
    --card-h: 232px;
    --row-gap: 46px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: var(--row-gap) 20px;
    padding: 10px 6px 30px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent calc(var(--card-h) + 18px),
      var(--shelf-edge) calc(var(--card-h) + 18px),
      var(--shelf-mid) calc(var(--card-h) + 22px),
      var(--shelf-dark) calc(var(--card-h) + 26px),
      transparent calc(var(--card-h) + 27px),
      transparent calc(var(--card-h) + var(--row-gap))
    );
  }
  .book-card{
    position:relative; height:var(--card-h);
    display:flex; flex-direction:column;
    cursor:pointer;
    transform-origin:bottom center;
    transition: transform .22s cubic-bezier(.2,.9,.3,1.3), filter .22s;
  }
  .book-card:hover{ transform: translateY(-10px) rotate(-1deg); }
  .book-cover{
    width:100%; flex:1; border-radius:5px 8px 8px 5px;
    object-fit:cover; background:#232838;
    box-shadow: -3px 0 0 rgba(0,0,0,.35) inset, 0 14px 22px -8px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.05);
  }
  .book-card .book-meta{margin-top:8px; padding:0 2px;}
  .book-card .book-title{
    font-size:12.5px; font-weight:600; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .book-card .book-author{font-size:11px; color:var(--text-dim); margin-top:2px;}
  .book-card .edit-dot{
    position:absolute; top:6px; left:6px; width:26px; height:26px; border-radius:50%;
    background:rgba(16,18,26,.7); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition:opacity .15s;
  }
  .book-card:hover .edit-dot{opacity:1;}
  .book-card .edit-dot:hover{background:var(--gold); }

  .empty-state{
    text-align:center; padding:80px 20px; color:var(--text-dim);
  }
  .empty-state .icon{font-size:40px; margin-bottom:14px;}
  .empty-state h2{font-family:'Cairo',sans-serif; color:var(--text); font-size:18px; margin-bottom:6px;}
  .empty-state button{
    margin-top:18px; background:var(--gold); color:#1a1108; font-weight:700;
    padding:10px 22px; border-radius:999px; font-size:14px;
  }

  /* ===== Modal shared ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(8,9,14,.72); backdrop-filter:blur(6px);
    display:flex; align-items:center; justify-content:center; z-index:100;
    padding:20px; opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--panel); border-radius:16px; width:100%; max-width:420px;
    padding:24px; box-shadow:var(--shadow-lg); border:1px solid rgba(255,255,255,.06);
    max-height:88vh; overflow-y:auto;
  }
  .modal h3{font-family:'Cairo',sans-serif; font-size:17px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px;}
  .field input[type=text]{
    width:100%; padding:10px 12px; background:var(--bg-2); border:1px solid rgba(255,255,255,.08);
    border-radius:8px; font-size:14px; outline:none;
  }
  .field input[type=text]:focus{border-color:var(--gold);}
  .file-drop{
    border:1.5px dashed rgba(255,255,255,.15); border-radius:10px; padding:16px;
    text-align:center; font-size:13px; color:var(--text-dim); cursor:pointer; position:relative;
    transition:border-color .15s, background .15s;
  }
  .file-drop:hover{border-color:var(--gold); background:rgba(201,162,75,.05);}
  .file-drop input{position:absolute; inset:0; opacity:0; cursor:pointer;}
  .file-drop.has-file{border-color:var(--gold); color:var(--text);}
  .cover-preview{
    width:90px; height:126px; object-fit:cover; border-radius:6px; margin:0 auto 10px;
    display:block; box-shadow:0 8px 16px rgba(0,0,0,.4);
  }
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .btn{flex:1; padding:11px; border-radius:9px; font-size:14px; font-weight:600; transition:opacity .15s;}
  .btn:hover{opacity:.88;}
  .btn-primary{background:var(--gold); color:#1a1108;}
  .btn-ghost{background:var(--bg-2); color:var(--text);}
  .btn-danger{background:transparent; color:var(--rust-bright); border:1px solid rgba(181,83,60,.4);}
  .hint{font-size:11.5px; color:var(--text-faint); margin-top:6px; line-height:1.5;}

  /* ===== Reader ===== */
  .reader{
    position:fixed; inset:0; background:#0b0c10; z-index:200;
    display:flex; flex-direction:column;
    opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .reader.show{opacity:1; pointer-events:auto;}
  .reader-bar{
    display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:rgba(16,18,26,.9); border-bottom:1px solid rgba(255,255,255,.06);
    flex-shrink:0;
  }
  .reader-bar .rt{flex:1; overflow:hidden;}
  .reader-bar .rt-title{font-size:14px; font-weight:600; white-space:nowrap; text-overflow:ellipsis; overflow:hidden;}
  .reader-bar .rt-sub{font-size:11.5px; color:var(--text-dim);}
  .icon-btn{
    width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--bg-2); flex-shrink:0; transition:background .15s;
  }
  .icon-btn:hover{background:#282e3d;}
  .reader-body{
    flex:1; overflow:auto; display:flex; align-items:flex-start; justify-content:center;
    padding:24px 12px; position:relative;
  }
  .reader-body canvas{box-shadow:0 20px 50px rgba(0,0,0,.6); border-radius:2px; max-width:100%; height:auto;}
  .reader-nav{
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding:12px; background:rgba(16,18,26,.9); border-top:1px solid rgba(255,255,255,.06); flex-shrink:0;
  }
  .reader-nav input{
    width:56px; text-align:center; background:var(--bg-2); border:1px solid rgba(255,255,255,.08);
    border-radius:6px; padding:6px; font-size:13px;
  }
  .reader-nav .pg-of{color:var(--text-dim); font-size:13px;}
  .reader-loading{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
    color:var(--text-dim); font-size:13px;
  }
  .spinner{
    width:28px; height:28px; border-radius:50%; border:3px solid rgba(255,255,255,.12);
    border-top-color:var(--gold); animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid rgba(255,255,255,.08); padding:12px 20px;
    border-radius:10px; font-size:13.5px; box-shadow:var(--shadow-lg); z-index:300;
    opacity:0; pointer-events:none; transition:all .25s; max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:600px){
    .shelf{--card-h:170px; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:38px 12px;}
    .search-wrap{max-width:none;}
    .brand span{display:none;}
    header{gap:10px; padding:12px 14px;}
    .add-btn span.lbl{display:none;}
    .add-btn{padding:10px 14px;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">ﻡ</div>
    <div>
      <h1>مكتبتي</h1>
      <span>مكتبة كتبك ورواياتك الخاصة</span>
    </div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="ابحث عن كتاب أو مؤلف…">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
  </div>
  <button class="add-btn" id="openAddBtn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>
    <span class="lbl">إضافة كتاب</span>
  </button>
</header>

<main>
  <div id="continueSection" style="display:none;">
    <h2 class="section-title">📖 متابعة القراءة</h2>
    <div class="continue-row" id="continueRow"></div>
  </div>

  <h2 class="section-title" id="libTitle">📚 مكتبتك</h2>
  <p class="section-sub" id="libSub">جميع كتبك مرتّبة في مكان واحد</p>
  <div class="shelf" id="shelfGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">📚</div>
    <h2>مكتبتك فاضية لسه</h2>
    <p>ابدأ بإضافة أول كتاب أو رواية عندك</p>
    <button id="emptyAddBtn">إضافة كتاب الآن</button>
  </div>
</main>

<!-- Add/Edit Modal -->
<div class="overlay" id="bookOverlay">
  <div class="modal">
    <h3 id="modalHeading">إضافة كتاب جديد</h3>

    <div id="addOnlyFields">
      <div class="field">
        <label>ملف الكتاب (PDF)</label>
        <div class="file-drop" id="pdfDrop">
          <span id="pdfDropLabel">اضغط لاختيار ملف PDF من جهازك</span>
          <input type="file" id="pdfInput" accept="application/pdf">
        </div>
      </div>
    </div>

    <img id="coverPreview" class="cover-preview" style="display:none;">

    <div class="field">
      <label>الغلاف (اختياري — إن لم تختر واحدًا سنولّده من الصفحة الأولى)</label>
      <div class="file-drop" id="coverDrop">
        <span id="coverDropLabel">اضغط لاختيار صورة غلاف</span>
        <input type="file" id="coverInput" accept="image/*">
      </div>
    </div>

    <div class="field">
      <label>العنوان</label>
      <input type="text" id="titleInput" placeholder="عنوان الكتاب">
    </div>
    <div class="field">
      <label>المؤلف</label>
      <input type="text" id="authorInput" placeholder="اسم المؤلف (اختياري)">
    </div>

    <p class="hint" id="sizeHint"></p>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelModalBtn">إلغاء</button>
      <button class="btn btn-primary" id="saveModalBtn">حفظ</button>
    </div>
    <div class="modal-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger" id="deleteBookBtn">حذف الكتاب من المكتبة</button>
    </div>
  </div>
</div>

<!-- Reader -->
<div class="reader" id="reader">
  <div class="reader-bar">
    <button class="icon-btn" id="closeReaderBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="rt">
      <div class="rt-title" id="readerTitle">—</div>
      <div class="rt-sub" id="readerSub">—</div>
    </div>
  </div>
  <div class="reader-body" id="readerBody">
    <canvas id="pdfCanvas"></canvas>
    <div class="reader-loading" id="readerLoading" style="display:none;">
      <div class="spinner"></div>
      <span>جاري تحميل الكتاب…</span>
    </div>
  </div>
  <div class="reader-nav">
    <button class="icon-btn" id="nextPageBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m9 6 6 6-6 6"/></svg>
    </button>
    <input type="text" id="pageInput" value="1">
    <span class="pg-of">من <span id="pageCount">1</span></span>
    <button class="icon-btn" id="prevPageBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m15 18-6-6 6-6"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- constants ----------
const CHUNK_RAW_SIZE = 3.2 * 1024 * 1024;      // raw bytes per chunk before base64
const MAX_PERSIST_BYTES = 45 * 1024 * 1024;    // beyond this, don't persist the PDF itself (cover+meta only)

// ---------- state ----------
let library = [];              // array of meta objects
let sessionFiles = {};         // id -> ArrayBuffer, in-memory cache for this session
let currentReaderBook = null;
let currentPdfDoc = null;
let currentPageNum = 1;
let editingId = null;
let pendingPdfFile = null;
let pendingCoverDataUrl = null;
let pendingAutoCoverDataUrl = null;

// ---------- helpers ----------
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2600);
}

function uid(){ return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function arrayBufferToBase64(buffer){
  let binary = '';
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  for(let i=0;i<bytes.length;i+=chunkSize){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunkSize));
  }
  return btoa(binary);
}
function base64ToUint8Array(base64){
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

function resizeImageDataUrl(dataUrl, maxW){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = ()=> resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function renderFirstPageAsCover(arrayBuffer){
  const doc = await pdfjsLib.getDocument({data: arrayBuffer.slice(0)}).promise;
  const page = await doc.getPage(1);
  const viewport = page.getViewport({scale: 1});
  const targetW = 360;
  const scale = targetW / viewport.width;
  const scaledViewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = scaledViewport.width;
  canvas.height = scaledViewport.height;
  await page.render({canvasContext: canvas.getContext('2d'), viewport: scaledViewport}).promise;
  return canvas.toDataURL('image/jpeg', 0.85);
}

// ---------- storage layer ----------
async function safeGet(key){
  try{ const r = await window.storage.get(key, false); return r ? r.value : null; }
  catch(e){ return null; }
}
async function safeSet(key, value){
  try{ const r = await window.storage.set(key, value, false); return !!r; }
  catch(e){ console.error('storage set failed', key, e); return false; }
}
async function safeDelete(key){
  try{ await window.storage.delete(key, false); }catch(e){}
}
async function safeListKeys(prefix){
  try{ const r = await window.storage.list(prefix, false); return r ? r.keys : []; }
  catch(e){ return []; }
}

async function loadLibraryIndex(){
  const raw = await safeGet('library-index');
  let ids = [];
  if(raw){ try{ ids = JSON.parse(raw); }catch(e){ ids = []; } }
  const metas = [];
  for(const id of ids){
    const m = await safeGet('book-meta:' + id);
    if(m){ try{ metas.push(JSON.parse(m)); }catch(e){} }
  }
  library = metas;
}

async function saveLibraryIndex(){
  const ids = library.map(b => b.id);
  await safeSet('library-index', JSON.stringify(ids));
}

async function saveBookMeta(meta){
  await safeSet('book-meta:' + meta.id, JSON.stringify(meta));
}

async function persistPdfChunks(id, arrayBuffer){
  const size = arrayBuffer.byteLength;
  if(size > MAX_PERSIST_BYTES) return { persisted:false, chunkCount:0, totalSize:size };
  const chunkCount = Math.ceil(size / CHUNK_RAW_SIZE);
  for(let i=0;i<chunkCount;i++){
    const start = i * CHUNK_RAW_SIZE;
    const end = Math.min(size, start + CHUNK_RAW_SIZE);
    const slice = arrayBuffer.slice(start, end);
    const b64 = arrayBufferToBase64(slice);
    const ok = await safeSet(`book-data:${id}:${i}`, b64);
    if(!ok) return { persisted:false, chunkCount:i, totalSize:size };
  }
  return { persisted:true, chunkCount, totalSize:size };
}

async function loadPdfBytesFromStorage(meta){
  if(sessionFiles[meta.id]) return sessionFiles[meta.id];
  if(!meta.persisted) return null;
  const parts = [];
  let total = 0;
  for(let i=0;i<meta.chunkCount;i++){
    const b64 = await safeGet(`book-data:${meta.id}:${i}`);
    if(!b64) return null;
    const bytes = base64ToUint8Array(b64);
    parts.push(bytes);
    total += bytes.length;
  }
  const merged = new Uint8Array(total);
  let offset = 0;
  for(const p of parts){ merged.set(p, offset); offset += p.length; }
  sessionFiles[meta.id] = merged.buffer;
  return merged.buffer;
}

async function deleteBookData(meta){
  if(meta.persisted){
    for(let i=0;i<meta.chunkCount;i++){
      await safeDelete(`book-data:${meta.id}:${i}`);
    }
  }
  await safeDelete('book-meta:' + meta.id);
  delete sessionFiles[meta.id];
}

// ---------- rendering the library ----------
function formatSize(bytes){
  if(!bytes) return '';
  const mb = bytes / (1024*1024);
  return mb >= 1 ? mb.toFixed(1) + ' م.ب' : Math.round(bytes/1024) + ' ك.ب';
}

function renderLibrary(){
  const grid = document.getElementById('shelfGrid');
  const empty = document.getElementById('emptyState');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  const filtered = library.filter(b=>{
    if(!query) return true;
    return (b.title||'').toLowerCase().includes(query) || (b.author||'').toLowerCase().includes(query);
  }).sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));

  grid.innerHTML = '';
  if(library.length === 0){
    empty.style.display = 'block';
    grid.style.display = 'none';
    document.getElementById('libSub').textContent = 'مكتبتك فاضية لسه';
  } else {
    empty.style.display = 'none';
    grid.style.display = 'grid';
    document.getElementById('libSub').textContent = `${library.length} كتاب في مكتبتك`;
    if(filtered.length === 0){
      grid.innerHTML = '<p style="color:var(--text-dim); grid-column:1/-1; padding:20px 4px;">ما لقينا كتب مطابقة لبحثك</p>';
    }
    for(const b of filtered){
      const card = document.createElement('div');
      card.className = 'book-card';
      card.innerHTML = `
        <button class="edit-dot" data-edit="${b.id}" title="تعديل">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <img class="book-cover" src="${b.cover || ''}" alt="${escapeHtml(b.title)}" loading="lazy">
        <div class="book-meta">
          <div class="book-title">${escapeHtml(b.title)}</div>
          ${b.author ? `<div class="book-author">${escapeHtml(b.author)}</div>` : ''}
        </div>
      `;
      card.addEventListener('click', (e)=>{
        if(e.target.closest('[data-edit]')) return;
        openReader(b);
      });
      card.querySelector('[data-edit]').addEventListener('click', (e)=>{
        e.stopPropagation();
        openEditModal(b);
      });
      grid.appendChild(card);
    }
  }

  renderContinueRow();
}

function renderContinueRow(){
  const section = document.getElementById('continueSection');
  const row = document.getElementById('continueRow');
  const inProgress = library
    .filter(b => b.lastPage && b.pageCount && b.lastPage > 1 && b.lastPage < b.pageCount)
    .sort((a,b)=> (b.lastReadAt||0) - (a.lastReadAt||0))
    .slice(0, 10);

  if(inProgress.length === 0){ section.style.display = 'none'; return; }
  section.style.display = 'block';
  row.innerHTML = '';
  for(const b of inProgress){
    const pct = Math.round((b.lastPage / b.pageCount) * 100);
    const card = document.createElement('div');
    card.className = 'continue-card';
    card.innerHTML = `
      <img src="${b.cover || ''}" alt="${escapeHtml(b.title)}">
      <div class="progress-bar"><div style="width:${pct}%;"></div></div>
      <div class="ct-title">${escapeHtml(b.title)}</div>
    `;
    card.addEventListener('click', ()=> openReader(b));
    row.appendChild(card);
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ---------- Add / Edit modal ----------
const bookOverlay = document.getElementById('bookOverlay');

function openAddModal(){
  editingId = null;
  pendingPdfFile = null;
  pendingCoverDataUrl = null;
  pendingAutoCoverDataUrl = null;
  document.getElementById('modalHeading').textContent = 'إضافة كتاب جديد';
  document.getElementById('addOnlyFields').style.display = 'block';
  document.getElementById('pdfDropLabel').textContent = 'اضغط لاختيار ملف PDF من جهازك';
  document.getElementById('pdfDrop').classList.remove('has-file');
  document.getElementById('coverDropLabel').textContent = 'اضغط لاختيار صورة غلاف';
  document.getElementById('coverDrop').classList.remove('has-file');
  document.getElementById('coverPreview').style.display = 'none';
  document.getElementById('titleInput').value = '';
  document.getElementById('authorInput').value = '';
  document.getElementById('sizeHint').textContent = '';
  document.getElementById('deleteRow').style.display = 'none';
  document.getElementById('pdfInput').value = '';
  document.getElementById('coverInput').value = '';
  bookOverlay.classList.add('show');
}

function openEditModal(book){
  editingId = book.id;
  pendingPdfFile = null;
  pendingCoverDataUrl = book.cover;
  document.getElementById('modalHeading').textContent = 'تعديل بيانات الكتاب';
  document.getElementById('addOnlyFields').style.display = 'none';
  document.getElementById('coverDropLabel').textContent = 'اضغط لتغيير صورة الغلاف';
  document.getElementById('coverDrop').classList.add('has-file');
  document.getElementById('coverPreview').src = book.cover || '';
  document.getElementById('coverPreview').style.display = 'block';
  document.getElementById('titleInput').value = book.title || '';
  document.getElementById('authorInput').value = book.author || '';
  document.getElementById('sizeHint').textContent = book.totalSize ? `حجم الملف: ${formatSize(book.totalSize)}` : '';
  document.getElementById('deleteRow').style.display = 'flex';
  document.getElementById('coverInput').value = '';
  bookOverlay.classList.add('show');
}

function closeModal(){ bookOverlay.classList.remove('show'); }

document.getElementById('openAddBtn').addEventListener('click', openAddModal);
document.getElementById('emptyAddBtn').addEventListener('click', openAddModal);
document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
bookOverlay.addEventListener('click', (e)=>{ if(e.target === bookOverlay) closeModal(); });

document.getElementById('pdfInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingPdfFile = file;
  document.getElementById('pdfDropLabel').textContent = `✓ ${file.name}`;
  document.getElementById('pdfDrop').classList.add('has-file');
  if(!document.getElementById('titleInput').value){
    document.getElementById('titleInput').value = file.name.replace(/\.pdf$/i, '');
  }
  document.getElementById('sizeHint').textContent = `حجم الملف: ${formatSize(file.size)}` +
    (file.size > MAX_PERSIST_BYTES ? ' — ملف كبير، سيُحفظ الغلاف فقط وسيبقى الكتاب متاحًا لهذه الجلسة إلى أن يُعاد رفعه لاحقًا' : '');
  try{
    const buf = await file.arrayBuffer();
    const cover = await renderFirstPageAsCover(buf);
    pendingAutoCoverDataUrl = cover;
    if(!pendingCoverDataUrl){
      document.getElementById('coverPreview').src = cover;
      document.getElementById('coverPreview').style.display = 'block';
    }
  }catch(err){
    console.error(err);
    showToast('تعذّر قراءة الصفحة الأولى لعمل غلاف تلقائي');
  }
});

document.getElementById('coverInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    const resized = await resizeImageDataUrl(reader.result, 500);
    pendingCoverDataUrl = resized;
    document.getElementById('coverPreview').src = resized;
    document.getElementById('coverPreview').style.display = 'block';
    document.getElementById('coverDropLabel').textContent = `✓ ${file.name}`;
    document.getElementById('coverDrop').classList.add('has-file');
  };
  reader.readAsDataURL(file);
});

document.getElementById('saveModalBtn').addEventListener('click', async ()=>{
  const title = document.getElementById('titleInput').value.trim();
  const author = document.getElementById('authorInput').value.trim();

  if(editingId){
    const book = library.find(b=>b.id === editingId);
    if(!book){ closeModal(); return; }
    book.title = title || book.title;
    book.author = author;
    if(pendingCoverDataUrl) book.cover = pendingCoverDataUrl;
    await saveBookMeta(book);
    renderLibrary();
    closeModal();
    showToast('تم تحديث بيانات الكتاب');
    return;
  }

  if(!pendingPdfFile){ showToast('اختر ملف PDF أولًا'); return; }
  if(!title){ showToast('اكتب عنوان الكتاب'); return; }

  const saveBtn = document.getElementById('saveModalBtn');
  saveBtn.textContent = 'جاري الحفظ…';
  saveBtn.disabled = true;

  try{
    const id = uid();
    const buf = await pendingPdfFile.arrayBuffer();
    sessionFiles[id] = buf;

    const cover = pendingCoverDataUrl || pendingAutoCoverDataUrl || '';
    let pageCount = 1;
    try{
      const doc = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;
      pageCount = doc.numPages;
    }catch(e){}

    const { persisted, chunkCount, totalSize } = await persistPdfChunks(id, buf);

    const meta = {
      id, title, author, cover,
      fileName: pendingPdfFile.name,
      pageCount, lastPage: 1, lastReadAt: 0,
      addedAt: Date.now(),
      persisted, chunkCount, totalSize
    };
    await saveBookMeta(meta);
    library.push(meta);
    await saveLibraryIndex();
    renderLibrary();
    closeModal();
    showToast(persisted ? 'تمت إضافة الكتاب لمكتبتك' : 'تمت الإضافة — الملف كبير فسيبقى متاحًا لهذه الجلسة فقط');
  }catch(err){
    console.error(err);
    showToast('حدث خطأ أثناء إضافة الكتاب');
  }finally{
    saveBtn.textContent = 'حفظ';
    saveBtn.disabled = false;
  }
});

document.getElementById('deleteBookBtn').addEventListener('click', async ()=>{
  if(!editingId) return;
  if(!confirm('هل تريد حذف هذا الكتاب من مكتبتك نهائيًا؟')) return;
  const book = library.find(b=>b.id === editingId);
  if(book) await deleteBookData(book);
  library = library.filter(b=>b.id !== editingId);
  await saveLibraryIndex();
  renderLibrary();
  closeModal();
  showToast('تم حذف الكتاب');
});

document.getElementById('searchInput').addEventListener('input', renderLibrary);

// ---------- Reader ----------
const readerEl = document.getElementById('reader');
const canvas = document.getElementById('pdfCanvas');

async function openReader(book){
  currentReaderBook = book;
  document.getElementById('readerTitle').textContent = book.title;
  document.getElementById('readerSub').textContent = book.author || '';
  document.getElementById('pageCount').textContent = book.pageCount || 1;
  readerEl.classList.add('show');
  document.getElementById('readerLoading').style.display = 'flex';
  canvas.style.display = 'none';

  try{
    const bytes = await loadPdfBytesFromStorage(book);
    if(!bytes){
      showToast('الملف غير متاح — يبدو أنه كبير جدًا ولم يُحفظ، أعد رفعه من زر التعديل');
      closeReader();
      return;
    }
    currentPdfDoc = await pdfjsLib.getDocument({data: bytes.slice(0)}).promise;
    currentPageNum = book.lastPage || 1;
    if(currentPageNum > currentPdfDoc.numPages) currentPageNum = 1;
    await renderPage(currentPageNum);
  }catch(err){
    console.error(err);
    showToast('تعذّر فتح الكتاب');
    closeReader();
  }
}

async function renderPage(num){
  document.getElementById('readerLoading').style.display = 'flex';
  const page = await currentPdfDoc.getPage(num);
  const container = document.getElementById('readerBody');
  const availableW = Math.min(container.clientWidth - 24, 900);
  const baseViewport = page.getViewport({scale:1});
  const scale = availableW / baseViewport.width;
  const viewport = page.getViewport({scale});
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext('2d'), viewport}).promise;
  document.getElementById('readerLoading').style.display = 'none';
  canvas.style.display = 'block';
  document.getElementById('pageInput').value = num;
  currentPageNum = num;

  if(currentReaderBook){
    currentReaderBook.lastPage = num;
    currentReaderBook.lastReadAt = Date.now();
    saveBookMeta(currentReaderBook);
  }
}

function closeReader(){
  readerEl.classList.remove('show');
  currentPdfDoc = null;
  currentReaderBook = null;
  renderLibrary();
}

document.getElementById('closeReaderBtn').addEventListener('click', closeReader);
document.getElementById('prevPageBtn').addEventListener('click', ()=>{
  if(currentPdfDoc && currentPageNum < currentPdfDoc.numPages) renderPage(currentPageNum + 1);
});
document.getElementById('nextPageBtn').addEventListener('click', ()=>{
  if(currentPdfDoc && currentPageNum > 1) renderPage(currentPageNum - 1);
});
document.getElementById('pageInput').addEventListener('change', (e)=>{
  let n = parseInt(e.target.value, 10);
  if(!currentPdfDoc) return;
  if(isNaN(n) || n < 1) n = 1;
  if(n > currentPdfDoc.numPages) n = currentPdfDoc.numPages;
  renderPage(n);
});
document.addEventListener('keydown', (e)=>{
  if(!readerEl.classList.contains('show')) return;
  if(e.key === 'ArrowLeft') document.getElementById('prevPageBtn').click();
  if(e.key === 'ArrowRight') document.getElementById('nextPageBtn').click();
  if(e.key === 'Escape') closeReader();
});

// ---------- init ----------
(async function init(){
  await loadLibraryIndex();
  renderLibrary();
})();

// ---------- PWA: service worker registration ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  });
}
</script>
